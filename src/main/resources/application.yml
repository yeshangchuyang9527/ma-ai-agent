spring:
  application:
    name: ma-ai-agent
    version: 1.0.0
  banner:
    location: classpath:txt/banner.txt
  profiles:
    active: local
  server:
    port: 8123
    servlet:
      context-path: /api
# springdoc-openapi 接口文档配置
springdoc:
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: alpha
  api-docs:
    path: /v3/api-docs
  group-configs:
    - group: 'default'
      paths-to-match: '/**'
      packages-to-scan: com.mahaoyang.maaiagent.controller
# knife4j 增强配置
knife4j:
  enable: true
  setting:
    language: zh_cn
